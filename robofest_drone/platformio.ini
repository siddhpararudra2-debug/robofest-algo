; PlatformIO Project Configuration File for Robofest Gujarat 6.0 Minefield Swarm Drone
; Mission Computer Target: Seeed Studio XIAO ESP32-S3 Sense (Dual-Core Xtensa LX7 @ 240MHz, 8MB PSRAM, 8MB Flash)
; Flight Controller Target: Matek H743-SLIM V3 (STM32H743 @ 480MHz, Dual IMU MPU6000 + ICM-42605)

[platformio]
default_envs = seeed_xiao_esp32s3
src_dir = .
test_dir = tests

; ============================================================================
; Common build settings shared by all ESP32-S3 drone environments
; ============================================================================
[env_common_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Serial diagnostic monitor speed
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder

; Flashing / Upload configuration
upload_speed = 921600

; Compiler and Preprocessor Options
build_unflags = 
    -std=gnu++11

build_flags = 
    -std=gnu++17
    -I src
    -I config
    -I hal
    -Wall
    -Wextra
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM
    -D CAMERA_MODEL_XIAO_ESP32S3_SENSE
    -mfix-esp32-psram-cache-issue

; Source file filtering — excludes code_reader.cpp (dead code, not called in
; mission flow; kept in repo for future integration and unit test coverage).
build_src_filter = 
    +<src/*.cpp>
    -<src/code_reader.cpp>
    +<src/calibration/*.cpp>
    +<src/self_test/*.cpp>
    +<hal/*.cpp>

; Pre-build hook (item 19): regenerate/validate vision_profiles_generated.h
extra_scripts = pre:scripts/pio_extra_script.py


; ============================================================================
; DEFAULT BUILD — DRONE_ID=1, SCOUT_LEFT (for single-drone testing)
; ============================================================================
[env:seeed_xiao_esp32s3]
extends = env_common_esp32s3


; ============================================================================
; PER-DRONE BUILD ENVIRONMENTS
; Flash each physical unit with its own identity to avoid duplicate-ID
; collisions in the swarm mesh.
; ============================================================================

[env:drone_1]
extends = env_common_esp32s3
build_flags = 
    ${env_common_esp32s3.build_flags}
    -D DRONE_ID_OVERRIDE=1
    -D DRONE_ROLE_OVERRIDE=0
    ; Role 0 = SCOUT_LEFT

[env:drone_2]
extends = env_common_esp32s3
build_flags = 
    ${env_common_esp32s3.build_flags}
    -D DRONE_ID_OVERRIDE=2
    -D DRONE_ROLE_OVERRIDE=1
    ; Role 1 = SCOUT_RIGHT

[env:drone_3]
extends = env_common_esp32s3
build_flags = 
    ${env_common_esp32s3.build_flags}
    -D DRONE_ID_OVERRIDE=3
    -D DRONE_ROLE_OVERRIDE=2
    ; Role 2 = GUIDE_MARKER


; ============================================================================
; NATIVE HOST TEST BUILD (desktop g++ / MinGW)
; ============================================================================
[env:native]
platform = native
test_dir = tests
test_build_src = yes
build_flags = 
    -std=gnu++17
    -I src
    -I config
    -I hal
    -Wall
    -Wextra
build_src_filter = 
    +<src/*.cpp>
    +<src/calibration/*.cpp>
    +<hal/*.cpp>
    -<src/main.cpp>

[env:esp32s3_generic]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -I src
    -I config
    -I hal
    -Wall
    -Wextra
    -D BOARD_HAS_PSRAM
build_src_filter = 
    +<src/*.cpp>
    -<src/code_reader.cpp>
    +<src/calibration/*.cpp>
    +<src/self_test/*.cpp>
    +<hal/*.cpp>
extra_scripts = pre:scripts/pio_extra_script.py

